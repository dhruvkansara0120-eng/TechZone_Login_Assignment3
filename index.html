<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechZone | Login</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <video autoplay muted loop playsinline id="bg-video">

        <source src="assets/background.mp4" type="video/mp4">

    </video>

    <!-- Dark Overlay -->

    <div class="overlay"></div>

   

    <div class="container">


        <div class="left-panel">

            <h1>TECHZONE</h1>

            <h2>Powering Your Digital Future</h2>

            <p>

                Welcome to TechZone, your destination for premium
                laptops, gaming PCs, computer accessories and
                cutting-edge technology.

            </p>

            <div class="features">

                <div class="feature">

                    <i class="fa-solid fa-microchip"></i>

                    <span>Latest Computer Hardware</span>

                </div>

                <div class="feature">

                    <i class="fa-solid fa-laptop"></i>

                    <span>Premium Laptops & PCs</span>

                </div>

                <div class="feature">

                    <i class="fa-solid fa-shield-halved"></i>

                    <span>Secure User Authentication</span>

                </div>

            </div>

        </div>



        <div class="login-card">

            <div class="logo">

                <div class="logo-circle">

                    <i class="fa-solid fa-user-lock"></i>

                </div>

            </div>

            <h2>LOGIN</h2>

            <p>

                Sign in to continue to your account

            </p>

            <form>



                <div class="input-box">

                    <i class="fa-regular fa-user"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address">

                </div>

  

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password">

                    <i
                        class="fa-regular fa-eye eye-icon"
                        id="togglePassword">

                    </i>

                </div>


                <div class="options">

                    <label>

                        <input
                            type="checkbox"
                            id="remember">

                        Remember Me

                    </label>

                    <a href="#">

                        Forgot Password?

                    </a>

                </div>

            

                <button
                    type="button"
                    id="loginButton"
                    onclick="login()">

                    Login

                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>



    <script src="js/script.js"></script>

</body>

</html>
